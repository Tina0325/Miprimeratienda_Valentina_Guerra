  <head>

    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <h1>🍽️ Ecommerce Comida Internacional - Harvey Sanabria</h1>

<p class="slogan">
  Sabores del mundo a un clic de distancia 🌎
</p>

<div class="beneficios">
  <span>🚚 Envíos en Bogotá</span>
  <span>🔒 Compra segura</span>

</div>

<div id="productos"></div>
